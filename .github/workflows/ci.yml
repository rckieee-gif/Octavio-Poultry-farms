name: CI Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify app can boot
      run: node -e "require('./src/app')"

    - name: Syntax check
      run: node --check server.js

    # TODO: Add a safe test database environment, then run backend migrations and regression tests
